name: PR Summary (MCP + Gemini, Python)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: write

jobs:
  pr-summary:
    runs-on: ubuntu-latest
    environment:
      name: pr-summary
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      SUMMARY_STYLE: concise
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/deps/requirements.txt

      - name: Generate PR summary (MCP tool -> Gemini)
        run: |
          python .github/scripts/mcp_client.py

      - name: Comment on PR (create or update last)
        run: |
          gh pr comment "$PR_NUMBER" --edit-last \
            --body-file .github/pr-summary.md
